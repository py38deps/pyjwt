---
name: CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: "Python ${{ matrix.python-version }} on ${{ matrix.platform }}"
    runs-on: "${{ matrix.platform }}"

    strategy:
      fail-fast: false
      matrix:
        platform: ["ubuntu-latest", "windows-latest"]
        python-version:
          - "3.8"
          - "3.9"
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
          - "3.15"
          - "pypy3.10"
          - "pypy3.11"

    steps:
      - uses: "actions/checkout@v7"
      - uses: "actions/setup-python@v7"

        with:
          python-version: "${{ matrix.python-version }}"
          allow-prereleases: true

      - name: "Install dependencies"
        run: |
          python -VV
          python -m site
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --upgrade coverage[toml] virtualenv tox tox-gh-actions

      - name: "Run tox targets for ${{ matrix.python-version }}"
        run: "python -m tox"

  package:
    name: "Build & verify package"
    runs-on: "ubuntu-latest"

    steps:
      - uses: "actions/checkout@v7"
      - uses: "actions/setup-python@v7"

        with:
          python-version: "3.9"

      - name: "Install build and twine"
        run: "python -m pip install build twine"

      - name: "Build package"
        run: "python -m build"

      - name: "List result"
        run: "ls -l dist"

      - name: "Check long_description"
        run: "python -m twine check dist/*"

  install-dev:
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "windows-latest", "macos-latest"]
        python-version: ["3.8", "3.9", "3.13"]

    name: "Verify dev env (Python ${{ matrix.python-version }}, ${{ matrix.os }})"
    runs-on: "${{ matrix.os }}"

    steps:
      - uses: "actions/checkout@v7"
      - uses: "actions/setup-python@v7"

        with:
          python-version: "${{ matrix.python-version }}"

      - name: "Install with no extras"
        run: "python -m pip install ."

      - name: "Import package"
        run: "python -c 'import jwt; print(jwt.__version__)'"

      - name: "Install with crypto extra"
        run: "python -m pip install .[crypto]"

      - name: "Import package with crypto"
        run: "python -c 'import jwt; print(jwt.__version__)'"

      - name: "Install in dev mode"
        run: "python -m pip install -e . --group dev"
        if: matrix.python-version != '3.8'  # pip --group requires pip>=25.1, which dropped Python 3.8

      - name: "Import package in dev mode"
        run: "python -c 'import jwt; print(jwt.__version__)'"
